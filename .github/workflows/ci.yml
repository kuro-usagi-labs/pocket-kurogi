name: Application checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  TZ: Asia/Jakarta
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --maxWorkers=1 --pool=threads
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  database:
    runs-on: ubuntu-latest
    environment: test
    env:
      TARGET_DATABASE_URL: ${{ secrets.TARGET_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Required isolated database integration (missing configuration fails)
        run: npm run test:db:required
